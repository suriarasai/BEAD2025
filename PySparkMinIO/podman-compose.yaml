# This file defines the services, networks, and volumes for our PySpark and MinIO environment.
services:
  # JupyterLab service with PySpark
  spark:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pyspark_jupyter
    ports:
      - "8888:8888" # Jupyter Notebook port
      - "4040:4040" # Spark UI port
    volumes:
      - ./data:/home/jovyan/data # Mount local data directory
      - ./notebooks:/home/jovyan/work # Mount notebooks directory
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - SPARK_MASTER_URL=local[*]
    networks:
      - spark-minio-net

  # MinIO S3-compatible object storage service
  minio:
    image: docker.io/minio/minio:latest # Using fully qualified name
    container_name: minio_server
    ports:
      - "9000:9000"  # MinIO API port
      - "9001:9001"  # MinIO Console port
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - spark-minio-net

volumes:
  minio_data:

networks:
  spark-minio-net:
    driver: bridge
